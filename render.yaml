services:
  - type: web
    name: junco-desk
    runtime: node
    plan: starter
    buildCommand: npm ci && npm --prefix studio ci && npm --prefix studio run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DESK_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: HOLD_WEBHOOK_URL
        sync: false
      - key: AG_STUDIO_LICENSE_KEY
        sync: false
      - key: AGENT_MODE
        value: "on"
